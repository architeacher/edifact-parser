type: "object"
required:
  - "id"
  - "interchange_id"
  - "processing_version_id"
  - "message_type"
  - "message_reference"
  - "created_at"
properties:
  id:
    type: "string"
    format: "uuid"
  interchange_id:
    type: "string"
    format: "uuid"
  processing_version_id:
    type: "string"
    format: "uuid"
  subscription_id:
    type: "string"
    format: "uuid"
    nullable: true
  message_type:
    type: "string"
    example: "MSCONS"
  message_reference:
    type: "string"
  segments:
    type: "object"
    additionalProperties: true
    description: "Full parsed segment tree (JSONB)"
  created_at:
    type: "string"
    format: "date-time"
